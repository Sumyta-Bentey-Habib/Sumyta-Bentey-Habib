<svg width="760" height="300" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="10" y="40" width="740" height="250" rx="6"/>
    </clipPath>
  </defs>

  <!-- Outer window -->
  <rect x="4" y="4" width="752" height="292" rx="12" fill="#0F172A" stroke="url(#glow)" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="4" y="4" width="752" height="34" rx="12" fill="#1E293B"/>
  <rect x="4" y="24" width="752" height="14" fill="#1E293B"/>
  <circle cx="28" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="21" r="6" fill="#27C93F"/>
  <text x="380" y="26" fill="#94A3B8" font-size="13" text-anchor="middle">sumyta@dev-system:~</text>

  <!-- Terminal body -->
  <g clip-path="url(#screenClip)" font-size="16">

    <text x="26" y="70" fill="#3B82F6">
      <tspan opacity="0">$ ./boot_sequence.sh</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.02;0.08" dur="12s" begin="0s" repeatCount="indefinite" fill="freeze"/>
    </text>

    <text x="26" y="100" fill="#E2E8F0">
      <tspan opacity="0">&gt; loading stack: MERN + Next.js .......... [OK]</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.10;0.18" dur="12s" begin="0s" repeatCount="indefinite" fill="freeze"/>
    </text>

    <text x="26" y="130" fill="#E2E8F0">
      <tspan opacity="0">&gt; mounting database drivers ............. [OK]</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.20;0.28" dur="12s" begin="0s" repeatCount="indefinite" fill="freeze"/>
    </text>

    <text x="26" y="160" fill="#E2E8F0">
      <tspan opacity="0">&gt; initializing creativity.exe ........... [OK]</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.30;0.38" dur="12s" begin="0s" repeatCount="indefinite" fill="freeze"/>
    </text>

    <text x="26" y="190" fill="#E2E8F0">
      <tspan opacity="0">&gt; connecting to caffeine_supply.......... [OK]</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.40;0.48" dur="12s" begin="0s" repeatCount="indefinite" fill="freeze"/>
    </text>

    <text x="26" y="220" fill="#EC4899">
      <tspan opacity="0">&gt; compiling ideas into scalable web apps</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.50;0.58" dur="12s" begin="0s" repeatCount="indefinite" fill="freeze"/>
    </text>

    <text x="26" y="260" font-size="20" font-weight="bold" fill="#8B5CF6">
      <tspan opacity="0">STATUS: ONLINE</tspan>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.62;0.68" dur="12s" begin="0s" repeatCount="indefinite" fill="freeze"/>
    </text>

    <!-- Blinking cursor -->
    <rect x="230" y="245" width="12" height="20" fill="#8B5CF6">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.64;0.90;0.92;1" dur="12s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1;0" dur="1s" begin="7.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Reset flash: whole screen fades out briefly before looping -->
    <rect x="0" y="0" width="760" height="300" fill="#0F172A">
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.94;0.97;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
